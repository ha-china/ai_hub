generate_image:
  name: 生成图像
  description: 使用SiliconFlow图像生成模型生成图像（需要SiliconFlow API密钥）
  fields:
    prompt:
      name: 提示词
      description: 描述要生成的图像内容
      required: true
      example: "一只可爱的猫咪坐在窗台上看夕阳"
      selector:
        text:
          multiline: true
    size:
      name: 图像尺寸
      description: 生成图像的尺寸
      required: false
      default: "1024x1024"
      selector:
        select:
          options:
            - "1024x1024"
            - "768x1344"
            - "864x1152"
            - "1344x768"
            - "1152x864"
            - "1440x720"
            - "720x1440"
    model:
      name: 模型
      description: 使用的图像生成模型
      required: false
      default: "Kwai-Kolors/Kolors"
      selector:
        select:
          options:
            - "Kwai-Kolors/Kolors"
            - "black-forest-labs/FLUX.1-schnell"

analyze_image:
  name: 分析图像
  description: 使用SiliconFlow分析图像内容（需要SiliconFlow API密钥）
  fields:
    image_file:
      name: 图像文件
      description: 要分析的图像文件路径
      required: false
      selector:
        text:
    image_entity:
      name: 图像实体
      description: 要分析的摄像头实体ID
      required: false
      selector:
        entity:
          domain: camera
    message:
      name: 分析指令
      description: 告诉AI如何分析这张图像
      required: true
      example: "请描述这张图片中的内容"
      selector:
        text:
          multiline: true
    model:
      name: 模型
      description: 使用的图像分析模型
      required: false
      default: "Qwen/Qwen3.5-4B"
      selector:
        select:
          options:
            - "Qwen/Qwen3.5-4B"
    temperature:
      name: 温度
      description: 控制输出的随机性，值越高输出越随机
      required: false
      default: 0.7
      selector:
        number:
          min: 0
          max: 1
          step: 0.1
    max_tokens:
      name: 最大令牌数
      description: 限制回答的最大长度
      required: false
      default: 1024
      selector:
        number:
          min: 1
          max: 4096
    stream:
      name: 流式输出
      description: 是否启用流式输出
      required: false
      default: false
      selector:
        boolean:

translate_components:
  name: 集成汉化
  description: 汉化指定的自定义集成的英文翻译为中文（需要SiliconFlow API密钥）
  fields:
    list_components:
      name: 列出已安装集成
      description: 仅列出已安装的集成及其翻译状态，不执行翻译操作
      required: false
      default: false
      selector:
        boolean:
    target_component:
      name: 指定集成
      description: 指定要汉化的集成名称，如"my_integration"。留空则汉化所有集成
      required: false
      default: ""
      selector:
        text:
    force_translation:
      name: 强制汉化
      description: 无论中文翻译文件是否存在，都强制重新翻译并覆盖现有翻译
      required: false
      default: false
      selector:
        boolean:

stt_transcribe:
  name: 语音转文本
  description: 使用SiliconFlow将语音文件转换为文本（需要Silicon Flow API密钥）
  fields:
    file:
      name: 音频文件
      description: 要转录的音频文件路径
      required: true
      selector:
        text:
    model:
      name: 模型
      description: 使用的STT模型
      required: false
      default: "FunAudioLLM/SenseVoiceSmall"
      selector:
        select:
          options:
            - "FunAudioLLM/SenseVoiceSmall"
            - "TeleAI/TeleSpeechASR"
    language:
      name: 语言
      description: 指定语言（HA 2025.12+ auto=自动检测）
      required: false
      default: "auto"
      selector:
        select:
          options:
            - "auto"
            - "zh-CN"
            - "en-US"
            - "ja-JP"
            - "ko-KR"

translate_blueprints:
  name: 蓝图汉化
  description: 汉化Home Assistant 蓝图文件的英文界面为中文（需要SiliconFlow API密钥）
  fields:
    list_blueprints:
      name: 列出蓝图
      description: 仅列出已导入的蓝图文件及其翻译状态，不执行翻译操作
      required: false
      default: false
      selector:
        boolean:
    target_blueprint:
      name: 指定蓝图
      description: 指定要汉化的蓝图文件名（不含扩展名），留空则汉化所有蓝图
      required: false
      default: ""
      selector:
        text:
    retranslate:
      name: 重新汉化
      description: 强制重新汉化所有蓝图，包括已经汉化过的文件
      required: false
      default: false
      selector:
        boolean:

tts_say:
  name: 文字转语音
  description: 使用Edge TTS生成语音，支持流式和非流式两种模式
  fields:
    text:
      name: 文本内容
      description: 要转换为语音的文本内容
      required: true
      example: "你好，欢迎使用文字转语音服务"
      selector:
        text:
          multiline: true
    voice:
      name: 语音
      description: 选择语音类型
      required: false
      default: "zh-CN-XiaoxiaoNeural"
      selector:
        select:
          options:
            - "zh-CN-XiaoxiaoNeural"
            - "zh-CN-XiaoyiNeural"
            - "zh-CN-YunjianNeural"
            - "zh-CN-YunxiNeural"
            - "zh-CN-YunxiaNeural"
            - "zh-CN-YunyangNeural"
            - "zh-HK-HiuGaaiNeural"
            - "zh-HK-HiuMaanNeural"
            - "zh-HK-WanLungNeural"
            - "zh-TW-HsiaoChenNeural"
            - "zh-TW-YunJheNeural"
            - "zh-TW-HsiaoYuNeural"
            - "en-US-JennyNeural"
            - "en-US-GuyNeural"
            - "en-GB-SoniaNeural"
            - "en-GB-RyanNeural"
            - "ja-JP-NanamiNeural"
            - "ja-JP-KeitaNeural"
            - "ko-KR-SunHiNeural"
            - "ko-KR-InJoonNeural"
    quality:
      name: 质量
      description: 语音质量（HA 2025.10+）
      required: false
      default: "default"
      selector:
        select:
          options:
            - "default"
            - "high"
            - "medium"
            - "low"
    media_player_entity:
      name: 媒体播放器
      description: 指定用于播放生成的语音的媒体播放器实体ID（可选）
      required: false
      selector:
        entity:
          domain: media_player
    stream:
      name: 流式输出
      description: 启用流式输出模式，音频通过事件总线实时推送（需监听ai_hub_tts_stream_chunk事件）
      required: false
      default: false
      selector:
        boolean:
    chunk_size:
      name: 块大小
      description: 流式模式下的音频块大小（字节），达到此大小时推送事件
      required: false
      default: 4096
      selector:
        number:
          min: 1024
          max: 32768
          step: 1024
